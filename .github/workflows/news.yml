name: Daily news

# Every morning (about 6:00 in India) pull today's headlines into assets/data/news.json, rebuild the site and commit
# the result. GitHub Pages then publishes it. Run it by hand from the Actions tab with "Run workflow".
on:
  schedule:
    - cron: "25 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch the news
        run: node tools/fetch-news.mjs
      - name: Rebuild the site
        run: |
          node tools/build.mjs
          node tools/check.mjs
      - name: Commit and push if anything changed
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git commit -m "News: daily update"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
