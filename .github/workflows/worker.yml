name: Deploy the helper backend

# Publishes backend/ to Cloudflare Workers (free plan) whenever it changes, or when you press "Run workflow".
# It needs two repository secrets (Settings, Secrets and variables, Actions): CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
# The AI keys are also read from repository secrets and sent to Cloudflare as Worker secrets. Add any of these you have:
# GEMINI_API_KEY, GROQ_API_KEY, TAVILY_API_KEY, OPENROUTER_API_KEY, ANTHROPIC_API_KEY. Backend setup is in backend/README.md.
on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/worker.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the Cloudflare secrets exist
        id: check
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Skipped: add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repository secrets first (see backend/README.md)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy the Worker
        if: steps.check.outputs.ok == 'true'
        working-directory: backend
        run: npx --yes wrangler@4 deploy
      - name: Send the AI keys to the Worker
        if: steps.check.outputs.ok == 'true'
        working-directory: backend
        run: |
          for name in GEMINI_API_KEY GROQ_API_KEY TAVILY_API_KEY OPENROUTER_API_KEY OPENROUTER_MODEL ANTHROPIC_API_KEY; do
            value="${!name}"
            if [ -n "$value" ]; then printf '%s' "$value" | npx --yes wrangler@4 secret put "$name" >/dev/null && echo "set $name"; fi
          done
      - name: Show the address
        if: steps.check.outputs.ok == 'true'
        working-directory: backend
        run: |
          echo "Deployed. Open the Cloudflare dashboard, Workers & Pages, who-we-are-helper, to see the address (https://who-we-are-helper.<your-name>.workers.dev)."
